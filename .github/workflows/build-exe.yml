name: build-exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: python app/build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: ezcodex-${{ matrix.os }}
          path: dist/
