name: build-xcoder

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name xcoder --console app/xcoder.py --clean -y
        shell: bash
      - name: Rename for OS
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ matrix.os }}" = "windows-latest" ]; then cp dist/xcoder.exe release/xcoder-windows-x64.exe; fi
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then cp dist/xcoder release/xcoder-linux-x64; fi
          if [ "${{ matrix.os }}" = "macos-latest" ]; then cp dist/xcoder release/xcoder-macos-x64; fi
          ls -la release/
      - uses: actions/upload-artifact@v4
        with:
          name: xcoder-${{ matrix.os }}
          path: release/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
